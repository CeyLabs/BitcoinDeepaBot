# HELP

helpMessage = """⚡️ *Wallet*
_Dieser Bot ist ein Bitcoin Lightning Wallet der Tips (kleine Beträge) auf Telegram senden kann. Um ein Tip zu senden, füge den Bot in einen Gruppenchat hinzu. Die grundlegende Einheit von Tips sind Satoshis (sat). 100,000,000 sat = 1 Bitcoin. Gebe 📚 /basics ein für mehr Informationen._

❤️ *Spenden*
_Dieser Bot erhebt keine Gebühren, kostet aber Satoshis um betrieben zu werden. Wenn du den Bot magst, kannst das Projekt mit eine Spende unterstützen. Um zu spenden, gebe ein: _ `/donate 1000`

%s

⚙️ *Befehle*
*/tip* 🏅 Antworte auf eine Nachricht um einen Tip zu senden: `/tip <betrag> [<memo>]`
*/balance* 👑 Frage dein Guthaben ab: `/balance`
*/send* 💸 Sende an einen Benutzer: `/send <betrag> @user oder user@ln.tips [<memo>]`
*/invoice* ⚡️ Empfange mit Lightning: `/invoice <betrag> [<memo>]`
*/pay* ⚡️ Bezahle mit Lightning: `/pay <invoice>`
*/donate* ❤️ Spende an das Projekt: `/donate 1000`
*/advanced* 🤖 Fortgeschrittene Funktionen.
*/help* 📖 Rufe die Hilfe auf."""

